name: bloom beat

# Bloom needs a nudge about once a minute or reminders sit unsent, and GitHub's
# cron is not dependable for that (it never fired in this repo). So this workflow
# keeps itself alive: each run pings Bloom every minute for about five and a half
# hours, then hands off to the next run before it exits. The concurrency group
# makes the next run wait for this one, so there is only ever one beat running.

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: bloom-beat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 352
    steps:
      - name: Beat every minute for about five and a half hours
        env:
          TICK_URL: ${{ secrets.BLOOM_TICK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -u
          if [ -z "${TICK_URL:-}" ]; then
            echo "BLOOM_TICK_URL secret is missing" >&2
            exit 1
          fi
          start=$(date +%s)
          end=$((start + 19800))      # 5h30m of beats
          handoff=$((start + 18900))  # hand over to the next run after 5h15m
          handed=0
          while [ "$(date +%s)" -lt "$end" ]; do
            now=$(date +%s)
            code=$(curl -s -o /tmp/beat.out -w '%{http_code}' -m 25 "$TICK_URL" || echo 000)
            echo "$(date -u +%H:%M:%S)Z http=$code $(head -c 200 /tmp/beat.out)"
            if [ "$code" != "200" ]; then
              echo "beat returned http=$code" >&2
            fi
            if [ "$handed" -eq 0 ] && [ "$now" -ge "$handoff" ]; then
              for try in 1 2 3; do
                if curl -fsS -X POST -m 30 \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$REPO/actions/workflows/bloom-beat.yml/dispatches" \
                  -d "{\"ref\":\"$REF\"}"; then
                  echo "handed off to the next run (try $try)"
                  echo handed > "$RUNNER_TEMP/beat-handed-off"
                  handed=1
                  break
                fi
                sleep 10
              done
            fi
            sleep 58
          done

      - name: Hand off if the loop stopped early
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -f "$RUNNER_TEMP/beat-handed-off" ]; then
            echo "already handed off"
            exit 0
          fi
          echo "loop stopped before hand-off; starting the next run now"
          curl -fsS -X POST -m 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/bloom-beat.yml/dispatches" \
            -d "{\"ref\":\"$REF\"}"
